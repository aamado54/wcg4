<nav class="ge-nav" aria-label="Centro Gerencial">
  {% for item in nav %}
  {% if item.launch %}
  <a href="{% url item.url_name %}"
     class="ge-nav-launch {% if item.active %}active{% endif %}">{{ item.label }}</a>
  {% else %}
  <a href="{% url item.url_name %}{% if bu %}?bu={{ bu }}{% endif %}{% if vista %}&amp;vista={{ vista }}{% endif %}"
     class="{% if item.active %}active{% endif %}">{{ item.label }}</a>
  {% endif %}
  {% if item.key == "detalle" %}
  <div class="ge-ccy" role="group" aria-label="Moneda del reporte">
    <a class="{% if ccy != 'USD' %}on{% endif %}" href="{% url 'gerencia:set_ccy' %}?ccy=GTQ" title="Ver en quetzales">Q</a>
    <a class="{% if ccy == 'USD' %}on{% endif %}" href="{% url 'gerencia:set_ccy' %}?ccy=USD" title="Ver en dólares{% if fx %} · TC {{ fx }}{% endif %}">$</a>
  </div>
  {% endif %}
  {% endfor %}
</nav>
