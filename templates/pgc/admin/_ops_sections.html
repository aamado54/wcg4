{# Requiere ops_hub en contexto (context processor core.ops_hub). #}
{% if ops_hub %}
<nav class="adm-ops-sections" aria-label="Secciones del centro de operaciones">
    {% for sec in ops_hub.sections %}
    <a href="{{ sec.url }}"
       class="adm-ops-section {% if sec.active %}active{% endif %}">{{ sec.label }}</a>
    {% endfor %}
</nav>
{% if ops_hub.subsections %}
<nav class="adm-ops-subsections" aria-label="Pantallas de la sección">
    {% for item in ops_hub.subsections %}
    <a href="{{ item.url }}"
       class="{% if item.active %}active{% endif %}"
       {% if item.external %}target="_blank" rel="noopener"{% endif %}>{{ item.label }}</a>
    {% endfor %}
</nav>
{% endif %}
{% endif %}
